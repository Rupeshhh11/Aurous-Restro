<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurous Restro | Live Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css?v=2.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .menu-card {
            perspective: 1000px;
        }
        .menu-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .menu-card:hover .menu-card-inner,
        .menu-card.flipped .menu-card-inner {
            transform: rotateY(180deg);
        }
        .menu-card-front, .menu-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.5rem;
            overflow: hidden;
        }
        .menu-card-front {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .menu-card-back {
            background: #141414;
            border: 1px solid #E0115F;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
        }
        .cart-fab {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: linear-gradient(135deg, #E0115F, #ff2e7e);
            color: white;
            padding: 1rem 2rem;
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(224, 17, 95, 0.4);
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        .cart-fab.visible {
            opacity: 1;
            pointer-events: all;
            bottom: 3rem;
        }
        .cart-fab:hover {
            transform: translateX(-50%) scale(1.05);
        }
        
        /* Category Chips */
        .category-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            padding: 0.5rem 1.5rem;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .category-chip.active {
            background: rgba(224, 17, 95, 0.2);
            border-color: #E0115F;
            color: white;
        }
    </style>
</head>
<body class="bg-[#050505] text-[#FAFAFA] font-sans antialiased min-h-screen">

    <!-- Auth Modal -->
    <div id="table-auth-modal" class="fixed inset-0 z-[200] flex items-center justify-center bg-black/95 backdrop-blur-xl">
        <div class="relative z-10 w-full max-w-md p-10 bg-[#0a0a0a] border border-white/10 rounded-3xl shadow-[0_0_50px_rgba(224,17,95,0.1)] text-center">
            <h2 class="text-3xl font-bold tracking-tight mb-2">Welcome to <span class="text-[#E0115F]">Aurous</span></h2>
            <p class="text-xs uppercase tracking-widest text-white/50 mb-8">Scan to Order Setup</p>
            
            <form id="auth-form" class="flex flex-col gap-5">
                <div>
                    <label class="block text-xs uppercase tracking-widest text-white/50 mb-2 font-semibold text-left">Table Number</label>
                    <input type="number" id="auth-table" required
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#E0115F] focus:bg-white/10 transition-colors text-white text-center text-xl font-bold"
                        placeholder="e.g. 5">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-white/50 mb-2 font-semibold text-left">4-Digit Access Code</label>
                    <input type="text" id="auth-code" required maxlength="4" style="text-transform: uppercase;"
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#E0115F] focus:bg-white/10 transition-colors text-white text-center text-2xl tracking-[0.5em] font-bold"
                        placeholder="••••">
                    <p class="text-[10px] text-white/30 mt-2 text-left">Ask your waiter for the table access code.</p>
                </div>
                <button type="submit" id="auth-btn"
                    class="mt-4 bg-[#E0115F] text-white py-4 rounded-xl text-xs uppercase tracking-[0.2em] hover:shadow-[0_0_20px_rgba(224,17,95,0.4)] transition-all font-bold btn-shine-effect overflow-hidden">
                    <span>Unlock Menu & Order</span>
                </button>
                <button type="button" onclick="bypassAuth()"
                    class="bg-transparent border border-white/20 text-white/70 py-3 rounded-xl text-xs uppercase tracking-widest hover:bg-white/5 transition-colors mt-2">
                    Just Browsing? View Menu
                </button>
                <div id="auth-error" class="hidden text-rose-500 text-xs font-bold mt-2">Invalid Table or Code</div>
            </form>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="hidden pb-32">
        <header class="pt-10 pb-6 px-6 md:px-12 border-b border-white/5 bg-[#0a0a0a] sticky top-0 z-40">
            <div class="max-w-7xl mx-auto flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl md:text-4xl font-bold tracking-tight uppercase">Live Menu</h1>
                    <p class="text-xs uppercase tracking-widest text-[#E0115F] mt-1">Table <span id="display-table-no" class="font-bold">--</span></p>
                </div>
                <a href="/" class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center hover:bg-white/10 transition-colors text-white/50 hover:text-white">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>
            
            <div class="max-w-7xl mx-auto">
                <div id="category-filters" class="flex overflow-x-auto hide-scrollbar gap-3 pb-2 snap-x">
                    <div class="category-chip active snap-start" data-cat="all">All</div>
                    <div class="category-chip snap-start" data-cat="Veg">Veg 🟢</div>
                    <div class="category-chip snap-start" data-cat="Non-Veg">Non-Veg 🔴</div>
                    <div class="category-chip snap-start" data-cat="Roti">Breads</div>
                    <div class="category-chip snap-start" data-cat="Drinks">Drinks 🍹</div>
                </div>
            </div>
        </header>

        <main class="p-6 md:p-12 max-w-7xl mx-auto">
            <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Menu items will be injected here via JS -->
            </div>
        </main>

        <div id="cart-fab" class="cart-fab" onclick="openCartModal()">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-bell-concierge"></i>
                <span id="cart-count" class="bg-white text-[#E0115F] w-6 h-6 rounded-full flex items-center justify-center text-xs font-black">0</span>
            </div>
            <div class="h-6 w-[1px] bg-white/30"></div>
            <span>View Order</span>
            <span id="cart-total" class="font-black">₹0</span>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 z-[150] flex items-end justify-center opacity-0 pointer-events-none transition-all duration-300">
        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm cursor-pointer" onclick="closeCartModal()"></div>
        <div class="relative z-10 w-full max-w-lg bg-[#0a0a0a] border-t border-white/10 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.5)] transform translate-y-full transition-transform duration-300" id="cart-box">
            <div class="p-6 md:p-8 max-h-[85vh] flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Your Order</h2>
                    <button onclick="closeCartModal()" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center hover:bg-[#E0115F] transition-colors"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <div id="cart-items" class="flex-grow overflow-y-auto hide-scrollbar space-y-4 mb-6">
                    <!-- Cart items injected here -->
                </div>
                
                <div class="border-t border-white/10 pt-4 mt-auto">
                    <div class="flex justify-between items-center mb-4 text-white/50 text-sm">
                        <span>Total Amount</span>
                        <span id="cart-final-total" class="text-xl text-white font-bold">₹0</span>
                    </div>
                    <button id="place-order-btn" onclick="placeOrder()"
                        class="w-full bg-[#E0115F] text-white py-4 rounded-xl text-sm uppercase tracking-[0.2em] font-bold btn-shine-effect overflow-hidden">
                        Place Order to Kitchen
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let menuData = [];
        let cart = {};
        let activeTable = null;

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tableNo = document.getElementById('auth-table').value;
            const code = document.getElementById('auth-code').value.toUpperCase();
            const btn = document.getElementById('auth-btn');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            
            try {
                const res = await fetch('/api/table/auth', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({table_number: parseInt(tableNo), auth_code: code})
                });
                
                if (res.ok) {
                    activeTable = tableNo;
                    document.getElementById('table-auth-modal').style.display = 'none';
                    document.getElementById('main-content').classList.remove('hidden');
                    document.getElementById('display-table-no').innerText = tableNo;
                    fetchMenu();
                } else {
                    document.getElementById('auth-error').classList.remove('hidden');
                    btn.innerHTML = '<span>Unlock Menu & Order</span>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('auth-error').innerText = "Network Error";
                document.getElementById('auth-error').classList.remove('hidden');
                btn.innerHTML = '<span>Unlock Menu & Order</span>';
            }
        });

        function bypassAuth() {
            activeTable = null;
            document.getElementById('table-auth-modal').style.display = 'none';
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('display-table-no').innerText = "Browsing";
            fetchMenu();
        }

        async function fetchMenu() {
            try {
                const res = await fetch('/api/menu');
                menuData = await res.json();
                renderMenu('all');
            } catch (err) {
                console.error("Failed to fetch menu", err);
            }
        }

        function renderMenu(category) {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            
            let filtered = menuData;
            if (category !== 'all') {
                filtered = menuData.filter(item => item.category === category);
            }
            
            filtered.forEach(item => {
                const qty = cart[item.id] ? cart[item.id].quantity : 0;
                const vegIcon = item.is_veg ? '<span class="text-green-500 text-xs border border-green-500 rounded-sm px-1">V</span>' : '<span class="text-red-500 text-xs border border-red-500 rounded-sm px-1">NV</span>';
                
                const card = document.createElement('div');
                card.className = 'menu-card h-[350px] w-full';
                card.innerHTML = `
                    <div class="menu-card-inner">
                        <!-- Front -->
                        <div class="menu-card-front flex flex-col">
                            <div class="h-3/5 w-full bg-black/50 relative">
                                <img src="${item.image_url || 'https://via.placeholder.com/400x300?text=Aurous'}" class="w-full h-full object-cover opacity-80">
                                <div class="absolute top-4 right-4 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold border border-white/10">₹${item.price}</div>
                            </div>
                            <div class="p-4 flex-grow flex flex-col justify-between">
                                <div>
                                    <h3 class="text-lg font-bold flex items-center gap-2">${item.name} ${vegIcon}</h3>
                                    <p class="text-[10px] text-white/40 uppercase tracking-wider mt-1">${item.category}</p>
                                </div>
                                <div class="text-xs text-[#E0115F] font-bold tracking-widest uppercase flex items-center gap-2">
                                    <span>Tap to Add</span> <i class="fa-solid fa-arrow-right"></i>
                                </div>
                            </div>
                        </div>
                        <!-- Back -->
                        <div class="menu-card-back">
                            <div>
                                <h3 class="text-xl font-bold mb-2">${item.name}</h3>
                                <p class="text-sm text-white/60 font-light leading-relaxed">${item.description || 'Deliciously crafted for you.'}</p>
                            </div>
                            <div class="flex items-center justify-between border-t border-white/10 pt-4">
                                <span class="text-2xl font-bold">₹${item.price}</span>
                                
                                <div class="flex items-center gap-3 bg-white/10 rounded-full px-2 py-1">
                                    <button onclick="updateCart(${item.id}, -1)" class="w-8 h-8 rounded-full bg-white/5 hover:bg-[#E0115F] flex items-center justify-center transition-colors"><i class="fa-solid fa-minus text-xs"></i></button>
                                    <span class="font-bold w-4 text-center" id="qty-${item.id}">${qty}</span>
                                    <button onclick="updateCart(${item.id}, 1)" class="w-8 h-8 rounded-full bg-white/5 hover:bg-[#E0115F] flex items-center justify-center transition-colors"><i class="fa-solid fa-plus text-xs"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                // Add flip logic for mobile tap
                card.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'I') {
                        document.querySelectorAll('.menu-card').forEach(c => {
                            if(c !== card) c.classList.remove('flipped');
                        });
                        card.classList.toggle('flipped');
                    }
                });
                
                grid.appendChild(card);
            });
        }

        function updateCart(id, change) {
            if (!activeTable) {
                alert("You are in browsing mode. Please refresh and enter a Table Code to order.");
                return;
            }
            const item = menuData.find(i => i.id === id);
            if (!item) return;
            
            if (!cart[id]) {
                cart[id] = { ...item, quantity: 0 };
            }
            
            cart[id].quantity += change;
            
            if (cart[id].quantity <= 0) {
                delete cart[id];
                document.getElementById(`qty-${id}`).innerText = "0";
            } else {
                document.getElementById(`qty-${id}`).innerText = cart[id].quantity;
            }
            
            updateCartFab();
        }

        function updateCartFab() {
            let totalQty = 0;
            let totalPrice = 0;
            
            Object.values(cart).forEach(item => {
                totalQty += item.quantity;
                totalPrice += item.quantity * item.price;
            });
            
            const fab = document.getElementById('cart-fab');
            if (totalQty > 0) {
                fab.classList.add('visible');
                document.getElementById('cart-count').innerText = totalQty;
                document.getElementById('cart-total').innerText = `₹${totalPrice}`;
            } else {
                fab.classList.remove('visible');
                closeCartModal();
            }
        }

        function openCartModal() {
            const modal = document.getElementById('cart-modal');
            const box = document.getElementById('cart-box');
            modal.style.opacity = '1';
            modal.style.pointerEvents = 'all';
            box.style.transform = 'translateY(0)';
            
            renderCartItems();
        }

        function closeCartModal() {
            const modal = document.getElementById('cart-modal');
            const box = document.getElementById('cart-box');
            box.style.transform = 'translateY(100%)';
            setTimeout(() => {
                modal.style.opacity = '0';
                modal.style.pointerEvents = 'none';
            }, 300);
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;
            
            Object.values(cart).forEach(item => {
                total += item.quantity * item.price;
                const el = document.createElement('div');
                el.className = 'flex justify-between items-center bg-white/5 p-4 rounded-xl border border-white/5';
                el.innerHTML = `
                    <div>
                        <h4 class="font-bold">${item.name}</h4>
                        <p class="text-xs text-[#E0115F]">₹${item.price} x ${item.quantity}</p>
                    </div>
                    <div class="flex items-center gap-2 bg-[#0a0a0a] rounded-full px-1 py-1 border border-white/10">
                        <button onclick="updateCartAndRender(${item.id}, -1)" class="w-7 h-7 rounded-full bg-white/5 hover:bg-[#E0115F] flex items-center justify-center transition-colors"><i class="fa-solid fa-minus text-[10px]"></i></button>
                        <span class="font-bold w-4 text-center text-sm">${item.quantity}</span>
                        <button onclick="updateCartAndRender(${item.id}, 1)" class="w-7 h-7 rounded-full bg-white/5 hover:bg-[#E0115F] flex items-center justify-center transition-colors"><i class="fa-solid fa-plus text-[10px]"></i></button>
                    </div>
                `;
                container.appendChild(el);
            });
            
            document.getElementById('cart-final-total').innerText = `₹${total}`;
        }
        
        function updateCartAndRender(id, change) {
            updateCart(id, change);
            if (Object.keys(cart).length === 0) {
                closeCartModal();
            } else {
                renderCartItems();
            }
        }

        async function placeOrder() {
            if (!activeTable || Object.keys(cart).length === 0) return;
            
            const btn = document.getElementById('place-order-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;
            
            const items = Object.values(cart).map(i => ({
                item_name: i.name,
                quantity: i.quantity,
                price_per_item: i.price
            }));
            
            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({table_number: parseInt(activeTable), items: items})
                });
                
                if (res.ok) {
                    alert("Order Placed Successfully! Kitchen is preparing your food.");
                    cart = {};
                    updateCartFab();
                    closeCartModal();
                    // Optional: redirect or show success UI
                } else {
                    alert("Failed to place order. Table might be inactive.");
                }
            } catch (err) {
                console.error(err);
                alert("Network error.");
            } finally {
                btn.innerHTML = 'Place Order to Kitchen';
                btn.disabled = false;
            }
        }

        // Category Filter Logic
        document.querySelectorAll('.category-chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                renderMenu(e.target.dataset.cat);
            });
        });
    </script>
</body>
</html>
