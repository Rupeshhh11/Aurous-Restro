<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurous Restro | Live Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css?v=2.1">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .menu-card {
            perspective: 1000px;
            -webkit-perspective: 1000px;
        }

        .menu-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }

        @media (hover: hover) {
            .menu-card:hover .menu-card-inner {
                transform: rotateY(180deg);
            }
        }

        .menu-card.flipped .menu-card-inner {
            transform: rotateY(180deg);
        }

        .menu-card-front,
        .menu-card-back {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.5rem;
            overflow: hidden;
        }

        .menu-card-front {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: rotateY(0deg) translateZ(1px);
            z-index: 2;
        }

        .menu-card-back {
            background: #141414;
            border: 1px solid #E0115F;
            transform: rotateY(180deg) translateZ(1px);
        }

        /* Force-hide the face that is not active (fixes mobile bleed-through) */
        .menu-card.flipped .menu-card-front {
            visibility: hidden;
            pointer-events: none;
        }

        .menu-card:not(.flipped) .menu-card-back {
            visibility: hidden;
            pointer-events: none;
        }

        .menu-card-back-content {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 0.4rem 0.5rem 0.35rem;
            min-height: 0;
        }

        .menu-card-back-content>.price-badge {
            top: 0.4rem;
            right: 0.4rem;
        }

        .cart-fab {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: linear-gradient(135deg, #E0115F, #ff2e7e);
            color: white;
            padding: 1rem 2rem;
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(224, 17, 95, 0.4);
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0;
            pointer-events: none;
        }

        .cart-fab.visible {
            opacity: 1;
            pointer-events: all;
            bottom: 3rem;
        }

        .cart-fab:hover {
            transform: translateX(-50%) scale(1.05);
        }

        /* Category Chips */
        .category-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            font-size: 0.625rem;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .category-chip.active {
            background: rgba(224, 17, 95, 0.2);
            border-color: #E0115F;
            color: white;
        }

        /* Menu card typography */
        .menu-card-title {
            font-size: 0.8125rem;
            line-height: 1.15;
            font-weight: 700;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .menu-card-desc {
            font-size: 0.625rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.55);
            display: -webkit-box;
            -webkit-line-clamp: 5;
            line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 0.2rem;
        }

        /* Back face: smaller title + description for long ingredient lists */
        .menu-card-back .menu-card-title {
            font-size: 0.6875rem;
            line-height: 1.2;
        }

        .menu-card-back .menu-card-desc {
            font-size: 0.5rem;
            line-height: 1.35;
            -webkit-line-clamp: 7;
            line-clamp: 7;
        }

        .menu-card-cta {
            font-size: 0.5625rem;
            letter-spacing: 0.12em;
            font-weight: 700;
            text-transform: uppercase;
        }

        .menu-card-category {
            font-size: 0.5625rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
        }

        .price-badge {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
            font-size: 0.625rem;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
        }

        .menu-card-image-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.5) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .menu-diet-badge {
            flex-shrink: 0;
            font-size: 0.5rem;
            font-weight: 700;
            padding: 0.1rem 0.25rem;
            border-radius: 0.125rem;
            line-height: 1;
        }

        .menu-diet-badge.veg {
            color: #22c55e;
            border: 1px solid #22c55e;
        }

        .menu-diet-badge.non-veg {
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .menu-cart-pill {
            font-size: 0.5rem;
            font-weight: 700;
            color: #E0115F;
            background: rgba(224, 17, 95, 0.15);
            padding: 0.15rem 0.4rem;
            border-radius: 999px;
        }

        .menu-card-back-body {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: 1.25rem;
            padding-right: 0.15rem;
        }

        .menu-card-back-footer {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 0.3rem;
            margin-top: 0.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-qty-stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            padding: 0.3rem 0.55rem;
            width: 100%;
            max-width: 9.5rem;
        }

        .menu-qty-stepper .qty-btn {
            width: 2.1rem;
            height: 2.1rem;
            min-width: 2.1rem;
            min-height: 2.1rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            border: none;
            color: white;
            cursor: pointer;
        }

        .menu-qty-stepper .qty-btn i {
            font-size: 0.7rem;
        }

        .menu-qty-stepper .qty-btn:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        .menu-qty-stepper .qty-btn-plus:hover {
            background: #E0115F;
        }

        .menu-qty-stepper .qty-value {
            font-size: 0.875rem;
            font-weight: 700;
            min-width: 1.15rem;
            text-align: center;
        }

        .cart-fab span,
        #cart-final-total {
            font-size: 0.75rem;
        }
    </style>
</head>

<body class="bg-[#050505] text-[#FAFAFA] font-sans antialiased min-h-screen">

    <!-- Auth Modal -->
    <div id="table-auth-modal"
        class="fixed inset-0 z-[200] flex items-center justify-center bg-black/95 backdrop-blur-xl">
        <div
            class="relative z-10 w-full max-w-md p-10 bg-[#0a0a0a] border border-white/10 rounded-3xl shadow-[0_0_50px_rgba(224,17,95,0.1)] text-center">
            <h2 class="text-3xl font-bold tracking-tight mb-2">Welcome to <span class="text-[#E0115F]">Aurous</span>
            </h2>
            <p class="text-xs uppercase tracking-widest text-white/50 mb-8">Scan to Order Setup</p>

            <form id="auth-form" class="flex flex-col gap-5">
                <div>
                    <label
                        class="block text-xs uppercase tracking-widest text-white/50 mb-2 font-semibold text-left">Table
                        Number</label>
                    <input type="number" id="auth-table" required
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#E0115F] focus:bg-white/10 transition-colors text-white text-center text-xl font-bold"
                        placeholder="e.g. 5">
                </div>
                <div>
                    <label
                        class="block text-xs uppercase tracking-widest text-white/50 mb-2 font-semibold text-left">4-Digit
                        Access Code</label>
                    <input type="text" id="auth-code" required maxlength="4" style="text-transform: uppercase;"
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#E0115F] focus:bg-white/10 transition-colors text-white text-center text-2xl tracking-[0.5em] font-bold"
                        placeholder="••••">
                    <p class="text-[10px] text-white/30 mt-2 text-left">Ask your waiter for the table access code.</p>
                </div>
                <button type="submit" id="auth-btn"
                    class="mt-4 bg-[#E0115F] text-white py-4 rounded-xl text-xs uppercase tracking-[0.2em] hover:shadow-[0_0_20px_rgba(224,17,95,0.4)] transition-all font-bold btn-shine-effect overflow-hidden">
                    <span>Unlock Menu & Order</span>
                </button>
                <button type="button" onclick="bypassAuth()"
                    class="bg-transparent border border-white/20 text-white/70 py-3 rounded-xl text-xs uppercase tracking-widest hover:bg-white/5 transition-colors mt-2">
                    Just Browsing? View Menu
                </button>
                <div id="auth-error" class="hidden text-rose-500 text-xs font-bold mt-2">Invalid Table or Code</div>
            </form>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="hidden pb-32">
        <header class="pt-0.5 pb-0.5 px-3 md:px-6 border-b border-white/5 bg-[#0a0a0a] sticky top-0 z-40">
            <div class="max-w-7xl mx-auto flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl md:text-4xl font-bold tracking-tight uppercase">Live Menu</h1>
                    <p class="text-xs uppercase tracking-widest text-[#E0115F] mt-1">Table <span id="display-table-no"
                            class="font-bold">--</span></p>
                </div>
                <a href="/"
                    class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center hover:bg-white/10 transition-colors text-white/50 hover:text-white">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>

            <div class="max-w-7xl mx-auto">
                <div id="category-filters" class="flex overflow-x-auto hide-scrollbar gap-3 pb-2 snap-x">
                    <!-- Chips generated dynamically -->
                </div>
            </div>
        </header>

        <main class="p-2 md:p-4 max-w-7xl mx-auto">
            <div id="menu-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
                <!-- Menu items will be injected here via JS -->
            </div>
        </main>

        <div id="cart-fab" class="cart-fab" onclick="openCartModal()">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-bell-concierge"></i>
                <span id="cart-count"
                    class="bg-white text-[#E0115F] w-6 h-6 rounded-full flex items-center justify-center text-xs font-black">0</span>
            </div>
            <div class="h-6 w-[1px] bg-white/30"></div>
            <span>View Order</span>
            <span id="cart-total" class="font-black">₹0</span>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal"
        class="fixed inset-0 z-[150] flex items-end justify-center opacity-0 pointer-events-none transition-all duration-300">
        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm cursor-pointer" onclick="closeCartModal()"></div>
        <div class="relative z-10 w-full max-w-lg bg-[#0a0a0a] border-t border-white/10 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.5)] transform translate-y-full transition-transform duration-300"
            id="cart-box">
            <div class="p-6 md:p-8 max-h-[85vh] flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Your Order</h2>
                    <button onclick="closeCartModal()"
                        class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center hover:bg-[#E0115F] transition-colors"><i
                            class="fa-solid fa-xmark"></i></button>
                </div>

                <div id="cart-items" class="flex-grow overflow-y-auto hide-scrollbar space-y-4 mb-6">
                    <!-- Cart items injected here -->
                </div>

                <div class="border-t border-white/10 pt-4 mt-auto">
                    <div class="flex justify-between items-center mb-4 text-white/50 text-sm">
                        <span>Total Amount</span>
                        <span id="cart-final-total" class="text-xl text-white font-bold">₹0</span>
                    </div>
                    <button id="place-order-btn" onclick="placeOrder()"
                        class="w-full bg-[#E0115F] text-white py-4 rounded-xl text-sm uppercase tracking-[0.2em] font-bold btn-shine-effect overflow-hidden">
                        Place Order to Kitchen
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let menuData = [];
        let cart = {};
        let activeTable = null;

        function mergeLinkedReservationToPhone(authData) {
            if (!authData || !authData.reservation) return;
            const linked = authData.reservation;
            let list = [];
            try {
                list = JSON.parse(localStorage.getItem('user_reservations') || '[]');
            } catch (e) {
                list = [];
            }
            const idx = list.findIndex(r => r.id === linked.id);
            const entry = { ...linked };
            if (idx >= 0) {
                list[idx] = { ...list[idx], ...entry };
            } else {
                list.push(entry);
            }
            localStorage.setItem('user_reservations', JSON.stringify(list));
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tableNo = document.getElementById('auth-table').value;
            const code = document.getElementById('auth-code').value.toUpperCase();
            const btn = document.getElementById('auth-btn');

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const res = await fetch('/api/table/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ table_number: parseInt(tableNo), auth_code: code })
                });

                if (res.ok) {
                    const authData = await res.json();
                    activeTable = tableNo;
                    mergeLinkedReservationToPhone(authData);
                    document.getElementById('table-auth-modal').style.display = 'none';
                    document.getElementById('main-content').classList.remove('hidden');
                    document.getElementById('display-table-no').innerText = tableNo;
                    fetchMenu();
                } else {
                    document.getElementById('auth-error').classList.remove('hidden');
                    btn.innerHTML = '<span>Unlock Menu & Order</span>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('auth-error').innerText = "Network Error";
                document.getElementById('auth-error').classList.remove('hidden');
                btn.innerHTML = '<span>Unlock Menu & Order</span>';
            }
        });

        function bypassAuth() {
            activeTable = null;
            document.getElementById('table-auth-modal').style.display = 'none';
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('display-table-no').innerText = "Browsing";
            fetchMenu();
        }

        async function fetchMenu() {
            try {
                const res = await fetch('/api/menu');
                menuData = await res.json();
                generateCategoryChips();
                renderMenu('all');
            } catch (err) {
                console.error("Failed to fetch menu", err);
            }
        }

        let currentFilter = 'all';

        function generateCategoryChips() {
            const container = document.getElementById('category-filters');
            container.innerHTML = '';

            // Add All chip
            const allChip = document.createElement('div');
            allChip.className = 'category-chip active snap-start';
            allChip.dataset.filter = 'all';
            allChip.textContent = 'All';
            container.appendChild(allChip);

            // Add Veg/Non-Veg chips
            const vegChip = document.createElement('div');
            vegChip.className = 'category-chip snap-start';
            vegChip.dataset.filter = 'veg';
            vegChip.textContent = '🟢 Vegetarian';
            container.appendChild(vegChip);

            const nonVegChip = document.createElement('div');
            nonVegChip.className = 'category-chip snap-start';
            nonVegChip.dataset.filter = 'non-veg';
            nonVegChip.textContent = '🔴 Non-Veg';
            container.appendChild(nonVegChip);

            // Add category chips
            const categories = [...new Set(menuData.map(item => item.category))];
            categories.forEach(cat => {
                const chip = document.createElement('div');
                chip.className = 'category-chip snap-start';
                chip.dataset.filter = 'cat:' + cat;
                chip.textContent = cat;
                container.appendChild(chip);
            });

            // Attach click listeners
            document.querySelectorAll('.category-chip').forEach(chip => {
                chip.addEventListener('click', (e) => {
                    document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.filter;
                    renderMenu();
                });
            });
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';

            let filtered = menuData;

            if (currentFilter === 'veg') {
                filtered = menuData.filter(item => item.is_veg === true);
            } else if (currentFilter === 'non-veg') {
                filtered = menuData.filter(item => item.is_veg === false);
            } else if (currentFilter.startsWith('cat:')) {
                const category = currentFilter.substring(4);
                filtered = menuData.filter(item => item.category === category);
            }
            // If currentFilter === 'all', use all items


            filtered.forEach(item => {
                const qty = cart[item.id] ? cart[item.id].quantity : 0;
                const dietBadge = item.is_veg
                    ? '<span class="menu-diet-badge veg">V</span>'
                    : '<span class="menu-diet-badge non-veg">NV</span>';
                const cartPill = qty > 0
                    ? `<span class="menu-cart-pill">${qty} in cart</span>`
                    : '';

                const card = document.createElement('div');
                card.className = 'menu-card h-[220px] w-full';
                card.innerHTML = `
                    <div class="menu-card-inner">
                        <!-- Front -->
                        <div class="menu-card-front flex flex-col">
                            <div class="h-3/5 w-full bg-black/50 relative shrink-0">
                                <img src="${item.image_url || 'https://via.placeholder.com/400x300?text=Aurous'}" alt="${item.name}" class="w-full h-full object-cover opacity-80">
                                <div class="menu-card-image-gradient"></div>
                                <div class="price-badge">₹${item.price}</div>
                            </div>
                            <div class="px-2.5 py-2 flex-grow flex flex-col justify-between min-h-0">
                                <div class="min-h-0">
                                    <div class="flex items-start justify-between gap-1.5 mb-0.5">
                                        <h3 class="menu-card-title text-white flex-1 min-w-0">${item.name}</h3>
                                        ${dietBadge}
                                    </div>
                                    <p class="menu-card-category mt-0.5">${item.category}</p>
                                </div>
                                <div class="flex items-center justify-between mt-1">
                                    <div class="menu-card-cta text-[#E0115F] flex items-center gap-1.5">
                                        <span>Tap to add</span>
                                        <i class="fa-solid fa-arrow-right text-[8px]"></i>
                                    </div>
                                    ${cartPill}
                                </div>
                            </div>
                        </div>
                        <!-- Back -->
                        <div class="menu-card-back">
                            <div class="menu-card-back-content">
                                <div class="price-badge">₹${item.price}</div>
                                <div class="menu-card-back-body">
                                    <h3 class="menu-card-title text-white shrink-0">${item.name}</h3>
                                    <p class="menu-card-desc">${item.description || 'Deliciously crafted for you.'}</p>
                                </div>
                                <div class="menu-card-back-footer">
                                    <div class="menu-qty-stepper">
                                        <button type="button" data-qty-minus="${item.id}" class="qty-btn" aria-label="Decrease quantity">
                                            <i class="fa-solid fa-minus"></i>
                                        </button>
                                        <span class="qty-value" id="qty-${item.id}">${qty}</span>
                                        <button type="button" data-qty-plus="${item.id}" class="qty-btn qty-btn-plus" aria-label="Increase quantity">
                                            <i class="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                card.querySelector('[data-qty-minus]').addEventListener('click', (e) => {
                    e.stopPropagation();
                    updateCart(item.id, -1);
                });
                card.querySelector('[data-qty-plus]').addEventListener('click', (e) => {
                    e.stopPropagation();
                    updateCart(item.id, 1);
                });

                card.addEventListener('click', (e) => {
                    if (e.target.closest('button')) return;
                    document.querySelectorAll('.menu-card').forEach(c => {
                        if (c !== card) c.classList.remove('flipped');
                    });
                    card.classList.toggle('flipped');
                });

                grid.appendChild(card);
            });
        }

        function updateCart(id, change) {
            if (!activeTable) {
                alert("You are in browsing mode. Please refresh and enter a Table Code to order.");
                return;
            }
            const item = menuData.find(i => i.id === id);
            if (!item) return;

            if (!cart[id]) {
                cart[id] = { ...item, quantity: 0 };
            }

            cart[id].quantity += change;

            const qtyEl = document.getElementById(`qty-${id}`);
            if (qtyEl) {
                qtyEl.innerText = cart[id] ? cart[id].quantity : "0";
            }

            if (cart[id] && cart[id].quantity <= 0) {
                delete cart[id];
            }

            const cardEl = qtyEl ? qtyEl.closest('.menu-card') : null;
            if (cardEl) {
                const ctaRow = cardEl.querySelector('.menu-card-front .flex.items-center.justify-between');
                let pill = cardEl.querySelector('.menu-cart-pill');
                const currentQty = cart[id] ? cart[id].quantity : 0;
                if (currentQty > 0) {
                    if (!pill && ctaRow) {
                        pill = document.createElement('span');
                        pill.className = 'menu-cart-pill';
                        ctaRow.appendChild(pill);
                    }
                    if (pill) pill.textContent = `${currentQty} in cart`;
                } else if (pill) {
                    pill.remove();
                }
            }

            updateCartFab();
        }

        function updateCartFab() {
            let totalQty = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                totalQty += item.quantity;
                totalPrice += item.quantity * item.price;
            });

            const fab = document.getElementById('cart-fab');
            if (totalQty > 0) {
                fab.classList.add('visible');
                document.getElementById('cart-count').innerText = totalQty;
                document.getElementById('cart-total').innerText = `₹${totalPrice}`;
            } else {
                fab.classList.remove('visible');
                closeCartModal();
            }
        }

        function openCartModal() {
            const modal = document.getElementById('cart-modal');
            const box = document.getElementById('cart-box');
            modal.style.opacity = '1';
            modal.style.pointerEvents = 'all';
            box.style.transform = 'translateY(0)';

            renderCartItems();
        }

        function closeCartModal() {
            const modal = document.getElementById('cart-modal');
            const box = document.getElementById('cart-box');
            box.style.transform = 'translateY(100%)';
            setTimeout(() => {
                modal.style.opacity = '0';
                modal.style.pointerEvents = 'none';
            }, 300);
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;

            Object.values(cart).forEach(item => {
                total += item.quantity * item.price;
                const el = document.createElement('div');
                el.className = 'flex justify-between items-center bg-white/5 p-4 rounded-xl border border-white/5';
                el.innerHTML = `
                    <div>
                        <h4 class="font-bold">${item.name}</h4>
                        <p class="text-xs text-[#E0115F]">₹${item.price} x ${item.quantity}</p>
                    </div>
                    <div class="flex items-center gap-2 bg-[#0a0a0a] rounded-full px-1 py-1 border border-white/10">
                        <button onclick="updateCartAndRender(${item.id}, -1)" class="w-7 h-7 rounded-full bg-white/5 hover:bg-[#E0115F] flex items-center justify-center transition-colors"><i class="fa-solid fa-minus text-[10px]"></i></button>
                        <span class="font-bold w-4 text-center text-sm">${item.quantity}</span>
                        <button onclick="updateCartAndRender(${item.id}, 1)" class="w-7 h-7 rounded-full bg-white/5 hover:bg-[#E0115F] flex items-center justify-center transition-colors"><i class="fa-solid fa-plus text-[10px]"></i></button>
                    </div>
                `;
                container.appendChild(el);
            });

            document.getElementById('cart-final-total').innerText = `₹${total}`;
        }

        function updateCartAndRender(id, change) {
            updateCart(id, change);
            if (Object.keys(cart).length === 0) {
                closeCartModal();
            } else {
                renderCartItems();
            }
        }

        async function placeOrder() {
            if (!activeTable || Object.keys(cart).length === 0) return;

            const btn = document.getElementById('place-order-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;

            const items = Object.values(cart).map(i => ({
                item_name: i.name,
                quantity: i.quantity,
                price_per_item: i.price
            }));

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ table_number: parseInt(activeTable), items: items })
                });

                if (res.ok) {
                    alert("Order Placed Successfully! Kitchen is preparing your food.");
                    cart = {};
                    updateCartFab();
                    closeCartModal();
                    // Optional: redirect or show success UI
                } else {
                    alert("Failed to place order. Table might be inactive.");
                }
            } catch (err) {
                console.error(err);
                alert("Network error.");
            } finally {
                btn.innerHTML = 'Place Order to Kitchen';
                btn.disabled = false;
            }
        }

        // Category Filter Logic
        document.querySelectorAll('.category-chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                renderMenu(e.target.dataset.cat);
            });
        });
    </script>
</body>

</html>
